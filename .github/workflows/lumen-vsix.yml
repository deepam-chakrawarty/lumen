name: lumen-vsix

# Build an installable Lumen .vsix for sideloading.
# Triggers: version tags (v*) and manual workflow_dispatch.
# On tags, also attaches the .vsix to a GitHub Release.
# Does not publish to the VS Marketplace.

on:
    push:
        tags:
            - "v*"
    workflow_dispatch:
        inputs:
            ref:
                description: "Git ref to build (branch, tag, or SHA). Leave empty for the dispatch ref."
                required: false
                type: string

permissions:
    contents: read

concurrency:
    group: lumen-vsix-${{ github.ref }}
    cancel-in-progress: false

jobs:
    build:
        name: Build Lumen VSIX
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - uses: actions/checkout@v4
              with:
                  ref: ${{ github.event.inputs.ref || github.ref }}
                  lfs: true

            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: "1.4.2"

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22

            - name: Install workspace dependencies
              run: bun install --frozen-lockfile

            - name: Build SDK packages
              run: bun run build:sdk

            - name: Read extension version
              id: version
              run: |
                  VERSION=$(node -p "require('./apps/vscode/package.json').version")
                  echo "version=$VERSION" >> "$GITHUB_OUTPUT"
                  echo "Extension version: $VERSION"

            - name: Package VSIX
              working-directory: apps/vscode
              env:
                  CLINE_ENVIRONMENT: production
              run: bun run package:vsix

            - name: Assert packaged identity
              working-directory: apps/vscode
              env:
                  EXPECTED_VERSION: ${{ steps.version.outputs.version }}
                  VSIX: lumen-${{ steps.version.outputs.version }}.vsix
              run: |
                  unzip -p "$VSIX" extension/package.json > /tmp/packaged-package.json
                  node -e '
                    const assert = require("node:assert");
                    const pkg = require("/tmp/packaged-package.json");
                    assert.equal(pkg.name, "lumen", `unexpected name ${pkg.name}`);
                    assert.equal(pkg.publisher, "deepam-chakrawarty", `unexpected publisher ${pkg.publisher}`);
                    assert.equal(pkg.version, process.env.EXPECTED_VERSION, `unexpected version ${pkg.version}`);
                    assert.ok(pkg.contributes?.configuration?.properties?.["lumen.proxyBaseUrl"]);
                    assert.ok(pkg.contributes?.views?.["lumen-ActivityBar"]);
                    console.log(`identity ok: ${pkg.publisher}.${pkg.name}@${pkg.version}`);
                    console.log(`engines.vscode=${pkg.engines.vscode}`);
                  '
                  unzip -l "$VSIX" | grep -E 'extension/dist/extension\.js|extension/webview-ui/build/index\.html|extension/LICENSE' 
                  ls -lh "$VSIX"

            - name: Upload VSIX artifact
              uses: actions/upload-artifact@v4
              with:
                  name: lumen-${{ steps.version.outputs.version }}
                  path: apps/vscode/lumen-${{ steps.version.outputs.version }}.vsix
                  if-no-files-found: error

            - name: Create GitHub Release (tags only)
              if: startsWith(github.ref, 'refs/tags/v')
              working-directory: apps/vscode
              env:
                  GH_TOKEN: ${{ github.token }}
                  TAG: ${{ github.ref_name }}
                  VERSION: ${{ steps.version.outputs.version }}
                  VSIX: lumen-${{ steps.version.outputs.version }}.vsix
              run: |
                  # Attach the VSIX to a release for this tag. Create the release
                  # if it does not exist yet; do not invent tags here.
                  if gh release view "$TAG" >/dev/null 2>&1; then
                    gh release upload "$TAG" "$VSIX" --clobber
                  else
                    gh release create "$TAG" "$VSIX" \
                      --title "Lumen $VERSION" \
                      --notes "Sideload build of Lumen $VERSION. See docs/SIDELOAD.md for install steps."
                  fi
